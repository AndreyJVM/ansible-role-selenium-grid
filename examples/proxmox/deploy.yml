---
- name: Create Selenium Grid VM in Proxmox
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Read SSH public key
      ansible.builtin.slurp:
        src: "{{ selenium_ssh_public_key_file | expanduser }}"
      register: selenium_ssh_key

    - name: Clone Ubuntu Cloud-Init template and configure VM
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        node: "{{ proxmox_node }}"
        clone: "{{ proxmox_template_name }}"
        name: "{{ proxmox_vm_name }}"
        newid: "{{ proxmox_vm_id }}"
        full: true
        storage: "{{ proxmox_storage }}"
        timeout: 600
        state: present
        cores: "{{ selenium_vm_cores }}"
        memory: "{{ selenium_vm_memory_mb }}"
        agent: enabled=1
        ciuser: "{{ selenium_vm_user }}"
        sshkeys: "{{ selenium_ssh_key.content | b64decode }}"
        nameservers: "{{ selenium_vm_dns }}"
        net:
          net0: "virtio,bridge={{ proxmox_bridge }}"
        ipconfig:
          ipconfig0: "ip={{ selenium_vm_ip }}/{{ selenium_vm_cidr }},gw={{ selenium_vm_gateway }}"
        update: true

    - name: Start VM
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ proxmox_vm_id }}"
        state: started

    - name: Add the VM to the in-memory inventory
      ansible.builtin.add_host:
        name: selenium_grid_vm
        groups: selenium_grid_targets
        ansible_host: "{{ selenium_vm_ip }}"
        ansible_user: "{{ selenium_vm_user }}"
        ansible_ssh_private_key_file: "{{ selenium_ssh_public_key_file | expanduser | regex_replace('\\.pub$', '') }}"
        ansible_become: true

- name: Wait for SSH and deploy Selenium Grid
  hosts: selenium_grid_targets
  gather_facts: false
  become: true
  vars_prompt:
    - name: basic_user
      prompt: "Basic Auth username for Selenium Grid"
      default: "admin"
      private: false
    - name: basic_password
      prompt: "Basic Auth password for Selenium Grid"
      private: true
    - name: domain_name
      prompt: "Domain name (DNS must point to this VM)"
      private: false
    - name: acme_email
      prompt: "Email for Let's Encrypt"
      private: false
  pre_tasks:
    - name: Wait until the guest accepts SSH connections
      ansible.builtin.wait_for_connection:
        timeout: 600
        sleep: 5
  roles:
    - role: "{{ playbook_dir }}/../.."
