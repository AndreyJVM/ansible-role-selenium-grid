name: Deploy Selenium Grid to Target Server

on:
  workflow_dispatch:
    inputs:
      vds_ip:
        description: 'VDS IP Address'
        required: true
      domain_name:
        description: 'Target domain name (e.g. selenium.yoursite.com)'
        required: true
      acme_email:
        description: 'Email for Let s Encrypt certificate notifications'
        required: true
      basic_user:
        description: 'Basic Auth username for Hub access'
        required: true
        default: 'admin'

jobs:
  deploy_to_vds:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: [Bootstrap] Execute Ansible Provisioning (Root)
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          # Запускаем Ansible напрямую с CI-раннера, подключаясь к VDS под root
          ansible-playbook -i "${{ github.event.inputs.vds_ip }}," -u root --private-key /tmp/deploy_key ansible/setup_vds.yml

      - name: [Deploy] Synchronize Infrastructure Files
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO"
          SOURCE: "selenium_grid_4/"
          REMOTE_HOST: ${{ github.event.inputs.vds_ip }}
          REMOTE_USER: "deployer"
          TARGET: "/opt/ui-tests-infra"
          
      - name: [Deploy] Initialize Docker Compose Services
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ github.event.inputs.vds_ip }}
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/ui-tests-infra
            
            # Устанавливаем apache2-utils, так как htpasswd требуется для генерации хэша
            # (уже должно быть установлено через Ansible, но защита от дурака не повредит)
            
            RAW_PASS="${{ secrets.SELENIUM_PASSWORD }}"
            HASHED_PASS=$(htpasswd -nb "${{ github.event.inputs.basic_user }}" "$RAW_PASS" | sed -e s/\\$/\\$\\$/g)
            
            echo "ACME_EMAIL=${{ github.event.inputs.acme_email }}" > .env
            echo "DOMAIN_NAME=${{ github.event.inputs.domain_name }}" >> .env
            echo "BASIC_AUTH_HASH=${HASHED_PASS}" >> .env
            
            sudo docker compose -f docker-compose.yml up -d
            echo "[SUCCESS] Deployment completed successfully."
