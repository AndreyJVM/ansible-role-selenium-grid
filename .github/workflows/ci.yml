name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-core ansible-lint

      - name: Run Yamllint
        run: yamllint -c .yamllint.yml .

      - name: Run Ansible Lint
        run: ansible-lint --version && ansible-lint .
        continue-on-error: true

  terraform:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Check Terraform formatting (fmt)
        run: terraform fmt -check -recursive

      - name: Validate Proxmox Module
        working-directory: examples/proxmox
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Selectel Module
        working-directory: examples/selectel
        run: |
          terraform init -backend=false
          terraform validate

  security:
    name: DevSecOps Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability & misconfiguration scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs,config'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  testcontainers:
    name: Testcontainers Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, terraform]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Testcontainers Suite (Ubuntu 22.04 & 24.04)
        run: mvn -B test
